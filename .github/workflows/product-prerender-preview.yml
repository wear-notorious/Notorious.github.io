name: NOTORIOUS product catalog
on:
  push:
    branches: [main]
    paths:
      - scripts/studio-build.mjs
      - scripts/studio-render.mjs
      - scripts/product-page.html.template
      - .github/workflows/product-prerender-preview.yml
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
concurrency:
  group: notorious-product-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build catalog with Studio SEO and availability
        run: node scripts/studio-build.mjs
      - name: Verify build is repeatable
        run: |
          git diff -- product-*.html sitemap.xml merchant-feed.txt catalog/studio-products.json > /tmp/before.patch
          node scripts/studio-build.mjs
          git diff -- product-*.html sitemap.xml merchant-feed.txt catalog/studio-products.json > /tmp/after.patch
          cmp /tmp/before.patch /tmp/after.patch
      - name: Save verified product output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-*.html sitemap.xml merchant-feed.txt catalog/studio-products.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NOTORIOUS product catalog"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

name: Prepare WebP images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimization/webp-conversion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python scripts/convert_images_to_webp.py
      - name: Commit WebP images and report to preview branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.webp' webp-conversion-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Add WebP image variants for review"
            git push origin HEAD:optimization/webp-conversion
          fi

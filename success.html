<!DOCTYPE html>
<html lang="en">
<head>
 <link rel="icon" type="image/png" href="images/Favicon-Notorious.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed | NOTORIOUS™</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .confirmation-box {
      width: 100%;
      max-width: 620px;
      text-align: center;
      border: 1px solid #222;
      padding: 50px 30px;
      background: #0b0b0b;
    }

    .logo {
      width: 170px;
      max-width: 70%;
      margin-bottom: 35px;
    }

    .check {
      width: 72px;
      height: 72px;
      border: 2px solid white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 34px;
      font-weight: bold;
    }

    h1 {
      font-size: 34px;
      letter-spacing: 2px;
      margin-bottom: 18px;
    }

    .subtitle {
      color: #bdbdbd;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .info-box {
      border-top: 1px solid #222;
      border-bottom: 1px solid #222;
      padding: 22px 0;
      margin-bottom: 30px;
    }

    .info-box p {
      margin: 8px 0;
      font-size: 15px;
    }

    .label {
      color: #888;
    }

    .button {
      display: inline-block;
      background: white;
      color: black;
      text-decoration: none;
      padding: 15px 30px;
      font-weight: bold;
      letter-spacing: 1px;
      transition: 0.2s;
    }

    .button:hover {
      background: #d9d9d9;
    }

    .tagline {
      margin-top: 35px;
      color: #666;
      font-size: 12px;
      letter-spacing: 1.5px;
    }

    @media (max-width: 600px) {
      .confirmation-box {
        padding: 40px 20px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="confirmation-box">

    <img src="images/Notorious-Logo-White.png" alt="NOTORIOUS" class="logo">

    <div class="check">✓</div>

    <h1>ORDER CONFIRMED</h1>

    <p class="subtitle">
      Thank you for your order.<br>
      Your order has been received successfully.
    </p>

  <div class="info-box">
<p>
  <span class="label">Order Number:</span>
  <strong><span id="orderNumber"></span></strong>
</p>
  <p>
    <span class="label">Product:</span>
    <span id="productName"></span>
  </p>

  <p>
    <span class="label">Size:</span>
    <span id="productSize"></span>
  </p>

  <p>
    <span class="label">Quantity:</span>
    <span id="productQuantity"></span>
  </p>

  <p>
    <span class="label">Total:</span>
    <strong><span id="orderTotal"></span> MAD</strong>
  </p>

  <p>
    <span class="label">Payment:</span>
    Cash on Delivery
  </p>

  <p>
    <span class="label">Next step:</span>
    Your order will be confirmed by phone before delivery.
  </p>

</div>

    <a href="index.html" class="button">
      CONTINUE SHOPPING
    </a>

    <p class="tagline">
      NOTORIOUS™ — WEAR WHAT THEY WON’T.
    </p>

  </div>
<script>
  const params = new URLSearchParams(window.location.search);
document.getElementById("orderNumber").textContent =
  params.get("orderId") || "-";
  document.getElementById("productName").textContent =
    params.get("product") || "-";

  document.getElementById("productSize").textContent =
    params.get("size") || "-";

  document.getElementById("productQuantity").textContent =
    params.get("quantity") || "1";

  document.getElementById("orderTotal").textContent =
    params.get("total") || "0";
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Your Cart | NOTORIOUS™</title>

  <link rel="icon" type="image/png" href="images/Favicon-Notorious.png">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050505;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    /* HEADER */
header {
  border-bottom: 1px solid #222;
  background: #080808;
}

nav {
  max-width: 1400px;
  margin: auto;
  padding: 22px 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo img {
  height: 85px;
  width: auto;
  display: block;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 45px;
}

@media (min-width: 701px) {
  nav {
    position: relative;
  }

  .nav-links {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }

  .cart-button {
    margin-left: auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-decoration: none;
    font-size: 20px;
  }

  .cart-count {
    position: absolute;
    top: -7px;
    right: -10px;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    border-radius: 50%;
    background: #fff;
    color: #000;
    font-size: 10px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
}

.nav-links a {
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 2px;
  position: relative;
  padding-bottom: 6px;
}

.nav-links a::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 0;
  height: 2px;
  background: white;
  transform: translateX(-50%);
  transition: width 0.3s ease;
}

.nav-links a:hover::after,
.nav-links a:focus::after,
.nav-links a:active::after {
  width: 100%;
}

.menu-toggle {
  display: none;
}

    /* MOBILE HEADER */

@media (max-width: 700px) {
  nav {
    height: 95px;
    padding: 0 25px;
    box-sizing: border-box;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .menu-toggle {
    display: flex !important;
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    align-items: center;
    justify-content: center;
    width: auto;
    height: auto;
    padding: 0;
    margin: 0;
    background: none;
    border: none;
    color: #fff;
    font-size: 32px;
    line-height: 1;
    cursor: pointer;
    z-index: 1001;
  }

  .logo {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }

  .logo img {
    height: 65px;
  }

  .cart-button {
    display: flex;
    position: absolute;
    right: 20px;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-decoration: none;
    font-size: 20px;
  }

  .cart-count {
    position: absolute;
    top: -7px;
    right: -10px;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    border-radius: 50%;
    background: #fff;
    color: #000;
    font-size: 10px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .nav-links {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background: #090909;
    border-top: 1px solid #222;
    border-bottom: 1px solid #222;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 25px;
    z-index: 1000;
  }

  .nav-links.active {
    display: flex;
  }

  .nav-links a {
    font-size: 10px;
    letter-spacing: 1px;
  }
}
    
    /* CART */

    .cart-page {
      max-width: 1250px;
      margin: auto;
      padding: 70px 30px 100px;
    }

    .eyebrow {
      color: #777;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(42px, 6vw, 72px);
      line-height: .95;
      letter-spacing: -2px;
      margin-bottom: 55px;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1.7fr .8fr;
      gap: 55px;
      align-items: start;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 150px 1fr auto;
      gap: 25px;
      padding: 25px 0;
      border-top: 1px solid #222;
      align-items: center;
    }

    .cart-item:last-child {
      border-bottom: 1px solid #222;
    }

    .cart-item img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .item-name {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .item-meta {
      color: #888;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .item-price {
      font-weight: 900;
      font-size: 16px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 18px;
    }

    .quantity-controls button {
      width: 34px;
      height: 34px;
      border: 1px solid #333;
      background: transparent;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
    }

    .quantity-controls button:hover {
      background: #fff;
      color: #000;
    }

   .remove-btn {
  margin-top: 15px;
  border: 0;
  background: none;
  color: #e53935;
  cursor: pointer;
  font-size: 18px;
  padding: 4px;
  transition: transform 0.2s ease, color 0.2s ease;
}

.remove-btn:hover {
  color: #ff5252;
  transform: scale(1.15);
}

    .line-total {
      font-weight: 900;
      font-size: 18px;
      white-space: nowrap;
    }

    /* SUMMARY */

    .summary {
      border: 1px solid #222;
      border-radius: 14px;
      padding: 30px;
      background: #0a0a0a;
      position: sticky;
      top: 25px;
    }

    .summary h2 {
      font-size: 20px;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 0;
      color: #aaa;
      border-bottom: 1px solid #222;
      font-size: 14px;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      padding: 25px 0;
      font-size: 22px;
      font-weight: 900;
    }

    .checkout-btn {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 18px 20px;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .checkout-btn:hover {
      opacity: .9;
    }

    .continue-shopping {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #888;
      font-size: 12px;
      text-decoration: none;
    }

    .continue-shopping:hover {
      color: #fff;
    }

    .empty-cart {
      border: 1px solid #222;
      border-radius: 14px;
      padding: 60px 25px;
      text-align: center;
    }

    .empty-cart i {
      font-size: 40px;
      margin-bottom: 20px;
    }

    .empty-cart h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .empty-cart p {
      color: #777;
      margin-bottom: 30px;
    }

    .shop-btn {
      display: inline-block;
      padding: 16px 28px;
      background: #fff;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      .cart-page {
        padding: 50px 20px 80px;
      }

      h1 {
        margin-bottom: 35px;
      }

      .cart-layout {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .cart-item {
        grid-template-columns: 95px 1fr;
        gap: 16px;
      }

      .cart-item img {
        width: 95px;
        height: 95px;
      }

      .line-total {
        grid-column: 2;
      }

      .summary {
        position: static;
      }
    }
  </style>
</head>

<body>

<header>
  <nav>

    <a class="logo" href="index.html">
      <img src="images/Notorious-Logo-White.png" alt="NOTORIOUS Logo">
    </a>

    <div class="nav-links">
      <a href="index.html">HOME</a>
      <a href="products.html">PRODUCTS</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT</a>
    </div>

    <a href="cart.html" class="cart-button" aria-label="Shopping cart">
      <i class="fa-solid fa-bag-shopping"></i>
      <span class="cart-count" id="cartCount">0</span>
    </a>

    <button class="menu-toggle" onclick="toggleMenu()" aria-label="Open menu">
      ☰
    </button>

  </nav>
</header>


<main class="cart-page">

  <div class="eyebrow">NOTORIOUS™</div>
  <h1>YOUR CART</h1>

  <div id="cartContent"></div>

</main>


<script>

function getCart() {
  return JSON.parse(localStorage.getItem("notoriousCart")) || [];
}


function saveCart(cart) {
  localStorage.setItem("notoriousCart", JSON.stringify(cart));
}


function renderCart() {

  const cart = getCart();
  const container = document.getElementById("cartContent");

  if (!cart.length) {

    container.innerHTML = `
      <div class="empty-cart">

        <i class="fa-solid fa-bag-shopping"></i>

        <h2>Your cart is empty.</h2>

        <p>Discover the latest NOTORIOUS™ pieces.</p>

        <a href="products.html" class="shop-btn">
          SHOP PRODUCTS
        </a>

      </div>
    `;

    return;
  }


  const subtotal = cart.reduce(
    (total, item) =>
      total + Number(item.price) * Number(item.quantity),
    0
  );


  const itemsHTML = cart.map((item, index) => `

    <div class="cart-item">

      <img
        src="${item.image}"
        alt="${item.product}"
      >

      <div>

        <div class="item-name">
          ${item.product}
        </div>

        <div class="item-meta">
          SIZE: ${item.size}
        </div>

        <div class="item-price">
          ${item.price} MAD
        </div>

        <div class="quantity-controls">

          <button onclick="changeQuantity(${index}, -1)">
            −
          </button>

          <span>${item.quantity}</span>

          <button onclick="changeQuantity(${index}, 1)">
            +
          </button>

        </div>

        <button
          class="remove-btn"
          onclick="removeItem(${index})"
        >
         <i class="fa-solid fa-trash"></i>
        </button>

      </div>

      <div class="line-total">
        ${Number(item.price) * Number(item.quantity)} MAD
      </div>

    </div>

  `).join("");


  container.innerHTML = `

    <div class="cart-layout">

      <section>
        ${itemsHTML}
      </section>

      <aside class="summary">

        <h2>ORDER SUMMARY</h2>

        <div class="summary-row">
          <span>Subtotal</span>
          <span>${subtotal} MAD</span>
        </div>

        <div class="summary-row">
          <span>Delivery</span>
          <span>Included</span>
        </div>

        <div class="summary-total">
          <span>TOTAL</span>
          <span>${subtotal} MAD</span>
        </div>

        <button
          class="checkout-btn"
          onclick="goToCheckout()"
        >
          CHECKOUT
        </button>

        <a
          href="products.html"
          class="continue-shopping"
        >
          ← CONTINUE SHOPPING
        </a>

      </aside>

    </div>

  `;
}


function changeQuantity(index, amount) {

  const cart = getCart();

  cart[index].quantity =
    Number(cart[index].quantity) + amount;

  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  }

  saveCart(cart);
  renderCart();
}


function removeItem(index) {

  const cart = getCart();

  cart.splice(index, 1);

  saveCart(cart);
  renderCart();
}


function goToCheckout() {

  const cart = getCart();

  if (!cart.length) return;

  localStorage.setItem(
    "notoriousCheckoutCart",
    JSON.stringify(cart)
  );

  window.location.href = "checkout.html?cart=1";
}


function toggleMenu() {

  document
    .querySelector(".nav-links")
    .classList.toggle("active");
}


renderCart();

  function updateCartCount() {
  const cart = JSON.parse(localStorage.getItem("notoriousCart")) || [];

  const total = cart.reduce(
    (sum, item) => sum + Number(item.quantity || 1),
    0
  );

  const cartCount = document.getElementById("cartCount");

  if (cartCount) {
    cartCount.textContent = total;
  }
}

updateCartCount();
</script>

</body>
</html>

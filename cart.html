<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Your Cart | NOTORIOUS™</title>

  <link rel="icon" type="image/png" href="images/Favicon-Notorious.png">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050505;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    /* HEADER */
header {
  border-bottom: 1px solid #222;
  background: #080808;
}

nav {
  max-width: 1400px;
  margin: auto;
  padding: 22px 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo img {
  height: 85px;
  width: auto;
  display: block;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 45px;
}

@media (min-width: 701px) {
  nav {
    position: relative;
  }

  .nav-links {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }

  .cart-button {
    margin-left: auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-decoration: none;
    font-size: 20px;
  }

  .cart-count {
    position: absolute;
    top: -7px;
    right: -10px;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    border-radius: 50%;
    background: #fff;
    color: #000;
    font-size: 10px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
}

.nav-links a {
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 2px;
  position: relative;
  padding-bottom: 6px;
}

.nav-links a::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 0;
  height: 2px;
  background: white;
  transform: translateX(-50%);
  transition: width 0.3s ease;
}

.nav-links a:hover::after,
.nav-links a:focus::after,
.nav-links a:active::after {
  width: 100%;
}

.menu-toggle {
  display: none;
}

    /* MOBILE HEADER */

@media (max-width: 700px) {
  nav {
    height: 95px;
    padding: 0 25px;
    box-sizing: border-box;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .menu-toggle {
    display: flex !important;
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    align-items: center;
    justify-content: center;
    width: auto;
    height: auto;
    padding: 0;
    margin: 0;
    background: none;
    border: none;
    color: #fff;
    font-size: 32px;
    line-height: 1;
    cursor: pointer;
    z-index: 1001;
  }

  .logo {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }

  .logo img {
    height: 65px;
  }

  .cart-button {
    display: flex;
    position: absolute;
    right: 20px;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-decoration: none;
    font-size: 20px;
  }

  .cart-count {
    position: absolute;
    top: -7px;
    right: -10px;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    border-radius: 50%;
    background: #fff;
    color: #000;
    font-size: 10px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .nav-links {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background: #090909;
    border-top: 1px solid #222;
    border-bottom: 1px solid #222;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 25px;
    z-index: 1000;
  }

  .nav-links.active {
    display: flex;
  }

  .nav-links a {
    font-size: 10px;
    letter-spacing: 1px;
  }
}
    
    /* CART */

    .cart-page {
      max-width: 1250px;
      margin: auto;
      padding: 70px 30px 100px;
    }

    .eyebrow {
      color: #777;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(42px, 6vw, 72px);
      line-height: .95;
      letter-spacing: -2px;
      margin-bottom: 55px;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1.7fr .8fr;
      gap: 55px;
      align-items: start;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 150px 1fr auto;
      gap: 25px;
      padding: 25px 0;
      border-top: 1px solid #222;
      align-items: center;
    }

    .cart-item:last-child {
      border-bottom: 1px solid #222;
    }

    .cart-item img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .item-name {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .item-meta {
      color: #888;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .item-price {
      font-weight: 900;
      font-size: 16px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 18px;
    }

    .quantity-controls button {
      width: 34px;
      height: 34px;
      border: 1px solid #333;
      background: transparent;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
    }

    .quantity-controls button:hover {
      background: #fff;
      color: #000;
    }

   .remove-btn {
  margin-top: 15px;
  border: 0;
  background: none;
  color: #e53935;
  cursor: pointer;
  font-size: 18px;
  padding: 4px;
  transition: transform 0.2s ease, color 0.2s ease;
}

.remove-btn:hover {
  color: #ff5252;
  transform: scale(1.15);
}

    .line-total {
      font-weight: 900;
      font-size: 18px;
      white-space: nowrap;
    }

    /* SUMMARY */

    .summary {
      border: 1px solid #222;
      border-radius: 14px;
      padding: 30px;
      background: #0a0a0a;
      position: sticky;
      top: 25px;
    }

    .summary h2 {
      font-size: 20px;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 0;
      color: #aaa;
      border-bottom: 1px solid #222;
      font-size: 14px;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      padding: 25px 0;
      font-size: 22px;
      font-weight: 900;
    }

    .checkout-btn {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 18px 20px;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .checkout-btn:hover {
      opacity: .9;
    }

    .continue-shopping {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #888;
      font-size: 12px;
      text-decoration: none;
    }

    .continue-shopping:hover {
      color: #fff;
    }

    .empty-cart {
      border: 1px solid #222;
      border-radius: 14px;
      padding: 60px 25px;
      text-align: center;
    }

    .empty-cart i {
      font-size: 40px;
      margin-bottom: 20px;
    }

    .empty-cart h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .empty-cart p {
      color: #777;
      margin-bottom: 30px;
    }

    .shop-btn {
      display: inline-block;
      padding: 16px 28px;
      background: #fff;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      .cart-page {
        padding: 50px 20px 80px;
      }

      h1 {
        margin-bottom: 35px;
      }

      .cart-layout {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .cart-item {
        grid-template-columns: 95px 1fr;
        gap: 16px;
      }

      .cart-item img {
        width: 95px;
        height: 95px;
      }

      .line-total {
        grid-column: 2;
      }

            .summary {
        position: static;
      }
    }

/* ===== PRODUCTS DROPDOWN ===== */
header {
  position: relative;
  z-index: 100;
}

.products-menu {
  position: relative;
}

.products-menu-btn {
  background: none;
  border: none;
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 2px;
  line-height: inherit;
  cursor: pointer;
  padding: 0 0 6px;
  margin: 0;
}

.products-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 18px);
  left: 50%;
  transform: translateX(-50%);
  min-width: 180px;
  padding: 12px 0;
  background: #0a0a0a;
  border: 1px solid #222;
  z-index: 2000;
}

.products-menu:hover .products-dropdown,
.products-menu:focus-within .products-dropdown {
  display: block;
}

.products-dropdown a {
  display: block;
  padding: 12px 18px 6px;
  white-space: nowrap;
}

.products-dropdown a:hover {
  background: #151515;
}

/* Pont invisible bach l-menu ma ytsedch mlli t7rrek la souris (desktop) */
@media (min-width: 701px) {
  .products-menu::before {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 18px;
  }
}

/* Mobile */
@media (max-width: 700px) {
  .products-menu {
    width: 100%;
    text-align: center;
  }

  .products-menu-btn {
    width: 100%;
    font-size: 10px;
    letter-spacing: 1px;
  }

  .products-menu-btn::after {
    content: "⌄";
    display: inline-block;
    margin-left: 8px;
    font-size: 14px;
    transition: transform 0.2s ease;
  }

  .products-menu.open .products-menu-btn::after {
    transform: rotate(180deg);
  }

  .products-dropdown {
    display: none !important;
    position: static;
    transform: none;
    min-width: 100%;
    background: #111;
    border: 1px solid #222;
    margin-top: 8px;
    padding: 4px 0;
  }

  .products-menu.open .products-dropdown {
    display: block !important;
  }

  .products-dropdown a {
    padding: 9px 14px;
    font-size: 10px;
    opacity: 0.8;
  }

  .products-dropdown a:hover {
    background: #181818;
    opacity: 1;
  }
}
    /* Sous-catégories dial TANK TOPS */
.products-dropdown a.sub-item {
  position: relative;
  margin-left: 26px;
  padding: 9px 18px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2.5px;
  color: #8a8a8a;
  opacity: 1;
  border-left: 1px solid #2f2f2f;
  transition: color 0.2s ease, border-color 0.2s ease;
}

.products-dropdown a.sub-item::before {
  content: "";
  position: absolute;
  left: -3px;
  top: 50%;
  width: 5px;
  height: 5px;
  background: #555;
  transform: translateY(-50%) rotate(45deg);
  transition: background 0.2s ease;
}

.products-dropdown a.sub-item::after {
  display: none;
}

.products-dropdown a.sub-item:hover {
  color: #fff;
  border-left-color: #fff;
}

.products-dropdown a.sub-item:hover::before {
  background: #fff;
}

@media (max-width: 800px) {
  .products-dropdown a.sub-item {
    margin-left: 0;
    padding: 8px 14px;
    font-size: 10px;
    border-left: none;
    text-align: center;
  }

  .products-dropdown a.sub-item::before {
    display: none;
  }
}

  </style>

<body>

<header>
  <nav>

    <a class="logo" href="index.html">
      <img src="images/Notorious-Logo-White.png" alt="NOTORIOUS Logo">
    </a>

    <div class="nav-links">
      <a href="index.html">HOME</a>
      <div class="products-menu">
  <button type="button" class="products-menu-btn">PRODUCTS</button>

 <div class="products-dropdown">
  <a href="products.html?category=tshirts">T-SHIRTS</a>
  <a href="products.html?category=hoodies">HOODIES</a>
  <a href="products.html?category=sweatshirts">SWEATSHIRTS</a>
  <a href="products.html?category=tanktops">TANK TOPS</a>
  <a href="products.html?category=hooded-tank-top" class="sub-item">HOODED TANK TOP</a>
  <a href="products.html?category=muscle-tee" class="sub-item">MUSCLE TEE</a>
  <a href="products.html?category=sweatshorts">SWEATSHORTS</a>
  <a href="products.html?category=pants">PANTS</a>
  <a href="products.html?category=caps">CAPS</a>
  <a href="products.html?category=bucket-hats">BUCKET HATS</a>
</div>
</div>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT</a>
    </div>

    <a href="cart.html" class="cart-button" aria-label="Shopping cart">
      <i class="fa-solid fa-bag-shopping"></i>
      <span class="cart-count" id="cartCount">0</span>
    </a>

    <button class="menu-toggle" onclick="toggleMenu()" aria-label="Open menu">
      ☰
    </button>

  </nav>
</header>


<main class="cart-page">

  <div class="eyebrow">NOTORIOUS™</div>
  <h1>YOUR CART</h1>

  <div id="cartContent"></div>

</main>


<script>

function getCart() {
  return JSON.parse(localStorage.getItem("notoriousCart")) || [];
}


function saveCart(cart) {
  localStorage.setItem("notoriousCart", JSON.stringify(cart));
}


function renderCart() {

  const cart = getCart();
  const container = document.getElementById("cartContent");

  if (!cart.length) {

    container.innerHTML = `
      <div class="empty-cart">

        <i class="fa-solid fa-bag-shopping"></i>

        <h2>Your cart is empty.</h2>

        <p>Discover the latest NOTORIOUS™ pieces.</p>

        <a href="products.html" class="shop-btn">
          SHOP PRODUCTS
        </a>

      </div>
    `;

    return;
  }


  const subtotal = cart.reduce(
    (total, item) =>
      total + Number(item.price) * Number(item.quantity),
    0
  );


  const itemsHTML = cart.map((item, index) => `

    <div class="cart-item">

      <img
        src="${item.image}"
        alt="${item.product}"
      >

      <div>

        <div class="item-name">
          ${item.product}
        </div>

        <div class="item-meta">
          SIZE: ${item.size}
        </div>

        <div class="item-price">
          ${item.price} MAD
        </div>

        <div class="quantity-controls">

          <button onclick="changeQuantity(${index}, -1)">
            −
          </button>

          <span>${item.quantity}</span>

          <button onclick="changeQuantity(${index}, 1)">
            +
          </button>

        </div>

        <button
          class="remove-btn"
          onclick="removeItem(${index})"
        >
         <i class="fa-solid fa-trash"></i>
        </button>

      </div>

      <div class="line-total">
        ${Number(item.price) * Number(item.quantity)} MAD
      </div>

    </div>

  `).join("");


  container.innerHTML = `

    <div class="cart-layout">

      <section>
        ${itemsHTML}
      </section>

      <aside class="summary">

        <h2>ORDER SUMMARY</h2>

        <div class="summary-row">
          <span>Subtotal</span>
          <span>${subtotal} MAD</span>
        </div>

        <div class="summary-row">
          <span>Delivery</span>
          <span>Included</span>
        </div>

        <div class="summary-total">
          <span>TOTAL</span>
          <span>${subtotal} MAD</span>
        </div>

        <button
          class="checkout-btn"
          onclick="goToCheckout()"
        >
          CHECKOUT
        </button>

        <a
          href="products.html"
          class="continue-shopping"
        >
          ← CONTINUE SHOPPING
        </a>

      </aside>

    </div>

  `;
}


function changeQuantity(index, amount) {

  const cart = getCart();

  cart[index].quantity =
    Number(cart[index].quantity) + amount;

  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  }

  saveCart(cart);
  renderCart();
}


function removeItem(index) {

  const cart = getCart();

  cart.splice(index, 1);

  saveCart(cart);
  renderCart();
  updateCartCount();
}


function goToCheckout() {

  const cart = getCart();

  if (!cart.length) return;

  localStorage.setItem(
    "notoriousCheckoutCart",
    JSON.stringify(cart)
  );

  window.location.href = "checkout.html?cart=1";
}


function toggleMenu() {

  document
    .querySelector(".nav-links")
    .classList.toggle("active");
}


renderCart();

 function updateCartCount() {
  const cart = JSON.parse(localStorage.getItem("notoriousCart")) || [];

  const total = cart.reduce(
    (sum, item) => sum + Number(item.quantity || 1),
    0
  );

  const cartCount = document.getElementById("cartCount");

  if (cartCount) {
    cartCount.textContent = total;
    cartCount.style.display = total > 0 ? "flex" : "none";
  }
}
  
updateCartCount();
</script>
<script>
  const productsBtn = document.querySelector('.products-menu-btn');
  const productsMenu = document.querySelector('.products-menu');

  productsBtn.addEventListener('click', () => {
    productsMenu.classList.toggle('open');
  });
</script>
  <script src="smoke-cursor.js" defer></script>
  <script>
    
  // Sedd le menu automatiquement fach l user kayscrolli l page (mashi darori yclicki 3la link)
  const navLinksEl = document.querySelector('.nav-links');
  const menuToggleBtn = document.querySelector('.menu-toggle');
  const productsMenuEl = document.querySelector('.products-menu');

  function closeMobileMenu() {
    if (!navLinksEl.classList.contains('active')) return; // ila mab9ach 7al, matdirch walo

    navLinksEl.classList.remove('active');
    productsMenuEl.classList.remove('open');

    menuToggleBtn.innerHTML = '☰';
    menuToggleBtn.setAttribute('aria-label', 'Open menu');
  }

  // scroll: mnin ybdaa yscrolli l page men wra le menu
  window.addEventListener('scroll', closeMobileMenu, { passive: true });

  // touchmove: bach ykoun rapide bzaf 3la mobile (9bel ma yewe3 scroll event)
  document.addEventListener('touchmove', closeMobileMenu, { passive: true });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOTORIOUS™</title>

  <link rel="icon" type="image/png" href="images/Favicon-Notorious.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .loading {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      letter-spacing: 2px;
      color: #aaa;
    }
    .product-layout {
  width: min(1180px, calc(100% - 40px));
  margin: 60px auto;
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 50px;
  align-items: start;
}

.gallery {
  min-width: 0;
}

.main-image-wrap {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #111;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid #222;
}

.main-product-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  touch-action: pan-y;
  user-select: none;
  transition: transform 0.22s ease, opacity 0.22s ease;
}

.thumbnails {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 12px;
}

    .gallery-dots {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
}

.gallery-dot {
  width: 7px;
  height: 7px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: #555;
  cursor: pointer;
  transition: all 0.25s ease;
}

.gallery-dot.active {
  width: 9px;
  height: 9px;
  background: #fff;
}
    
.thumbnail {
  padding: 0;
  border: 1px solid #222;
  background: #111;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  aspect-ratio: 1 / 1;
}

.thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.thumbnail.active {
  border-color: #fff;
}

.product-details {
  padding-top: 10px;
}

.brand-label {
  color: #888;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.product-details h1 {
  font-size: clamp(30px, 4vw, 52px);
  line-height: 1.05;
  margin-bottom: 18px;
}

.product-price {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 22px;
}

.product-description {
  color: #bbb;
  font-size: 15px;
  line-height: 1.7;
  margin-bottom: 24px;
}

.product-meta {
  padding: 18px 0;
  border-top: 1px solid #222;
  border-bottom: 1px solid #222;
  color: #aaa;
  font-size: 14px;
  line-height: 1.8;
}

.size-section {
  margin-top: 28px;
}

.size-section h3 {
  font-size: 13px;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

.size-options {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.size-btn {
  min-width: 52px;
  height: 46px;
  padding: 0 14px;
  background: #111;
  color: #fff;
  border: 1px solid #333;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
}

.size-btn:hover,
.size-btn.active {
  background: #fff;
  color: #000;
  border-color: #fff;
}

.size-guide-btn {
  margin-top: 14px;
  padding: 10px 14px;
  background: transparent;
  color: #fff;
  border: 1px solid #333;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
}

.quantity-section {
  margin-top: 24px;
}

.quantity-section label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.quantity-section select {
  width: 100px;
  padding: 12px;
  background: #111;
  color: #fff;
  border: 1px solid #333;
  border-radius: 8px;
}

.order-btn {
  width: 100%;
  margin-top: 28px;
  padding: 16px 20px;
  background: #fff;
  color: #000;
  border: 0;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 1px;
  cursor: pointer;
}

.order-btn:hover {
  opacity: 0.9;
}
    .add-cart-btn {
  width: 100%;
  margin-top: 14px;
  padding: 16px 20px;
  background: transparent;
  color: #fff;
  border: 1px solid #fff;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 1px;
  cursor: pointer;
}

.add-cart-btn:hover {
  background: #fff;
  color: #000;
}

.payment-note {
  margin-top: 12px;
  color: #777;
  font-size: 12px;
  text-align: center;
}

.size-guide-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.size-guide-modal.active {
  display: flex;
}

.size-guide-content {
  position: relative;
  width: 100%;
  max-width: 560px;
  background: #111;
  border: 1px solid #2a2a2a;
  border-radius: 18px;
  padding: 28px;
}

.size-guide-close {
  position: absolute;
  top: 12px;
  right: 16px;
  border: 0;
  background: none;
  color: #fff;
  font-size: 30px;
  cursor: pointer;
}

.size-guide-note,
.size-guide-disclaimer {
  color: #999;
  font-size: 13px;
  margin-top: 8px;
}

.size-guide-table {
  width: 100%;
  border-collapse: collapse;
  margin: 22px 0 16px;
}

.size-guide-table th,
.size-guide-table td {
  padding: 12px 8px;
  border: 1px solid #333;
  text-align: center;
}

.size-guide-table th {
  background: #1a1a1a;
}

@media (max-width: 800px) {

.sizes {

.size-btn {

}

.quantity-row {

}

.order-btn {

  padding: 18px 20px;
  font-size: 16px;
}
  .thumbnails {
    gap: 8px;
  }
}

const PRODUCTS_API_URL = "https://script.google.com/macros/s/AKfycbyIP21O7KWxxv4T-4N1mUXLgnQaKPS3Hp12S8tKIPKV7XlQBHBOS6D3v0TGSiq6Zp41Gw/exec";

async function loadProduct() {

if (cachedProducts) {

}

localStorage.setItem(

   const productImages = [

</div>

let selectedSize = "";

function changeImage(image, button) {
  document.getElementById("mainProductImage").src = image;

  document.querySelectorAll(".thumbnail").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");
  const thumbnails = Array.from(document.querySelectorAll(".thumbnail"));
const dots = document.querySelectorAll(".gallery-dot");
const activeIndex = thumbnails.indexOf(button);

dots.forEach(dot => {
  dot.classList.remove("active");
});

if (dots[activeIndex]) {
  dots[activeIndex].classList.add("active");
}
}
let touchStartX = 0;
let touchEndX = 0;

function handleSwipe() {
  const minSwipeDistance = 50;

  if (touchStartX - touchEndX > minSwipeDistance) {
    swipeImage(1);
  }

  if (touchEndX - touchStartX > minSwipeDistance) {
    swipeImage(-1);
  }
}

function swipeImage(direction) {
  const thumbnails = Array.from(document.querySelectorAll(".thumbnail"));
  const mainImage = document.getElementById("mainProductImage");

  if (!thumbnails.length || !mainImage) return;

  let currentIndex = thumbnails.findIndex(btn =>
    btn.classList.contains("active")
  );

  let newIndex = currentIndex + direction;

  if (newIndex >= thumbnails.length) {
    newIndex = 0;
  }

  if (newIndex < 0) {
    newIndex = thumbnails.length - 1;
  }

  const moveOut = direction === 1 ? "-35px" : "35px";
  const moveIn = direction === 1 ? "35px" : "-35px";

  mainImage.style.transform = `translateX(${moveOut})`;
  mainImage.style.opacity = "0";

  setTimeout(() => {
    thumbnails[newIndex].click();

    mainImage.style.transition = "none";
    mainImage.style.transform = `translateX(${moveIn})`;

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        mainImage.style.transition = "transform 0.22s ease, opacity 0.22s ease";
        mainImage.style.transform = "translateX(0)";
        mainImage.style.opacity = "1";
      });
    });
  }, 220);
}

document.addEventListener("touchstart", function(e) {
  if (e.target.id === "mainProductImage") {
    touchStartX = e.changedTouches[0].screenX;
  }
});

document.addEventListener("touchend", function(e) {
  if (e.target.id === "mainProductImage") {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
  }
});
  
function selectSize(size, button) {
  selectedSize = size;

  document.querySelectorAll(".size-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");
}

function openSizeGuide() {
  document.getElementById("sizeGuideModal").classList.add("active");
}

function closeSizeGuide() {
  document.getElementById("sizeGuideModal").classList.remove("active");
}
function addToCart() {
  if (!selectedSize) {
    alert("Please select a size.");
    return;
  }

  const quantity = parseInt(document.getElementById("quantity").value);
  const product = window.currentProduct;

  let cart = JSON.parse(localStorage.getItem("notoriousCart")) || [];

  const existingItem = cart.find(
    item => item.slug === product.slug && item.size === selectedSize
  );

  if (existingItem) {
    existingItem.quantity += quantity;
  } else {
    cart.push({
      slug: product.slug,
      product: product.product,
      price: Number(product.price),
      image: product.mainImage,
      size: selectedSize,
      quantity: quantity
    });
  }

  localStorage.setItem("notoriousCart", JSON.stringify(cart));
  
const cartCount = cart.reduce((total, item) => total + item.quantity, 0);
document.getElementById("cartCount").textContent = cartCount;
  
  showCartNotification();
}
  function showCartNotification() {
  const oldNotification = document.querySelector(".cart-notification");
  if (oldNotification) oldNotification.remove();

  const notification = document.createElement("div");
  notification.className = "cart-notification";

  notification.innerHTML = `
    <span class="cart-notification-icon">✓</span>
    <div>
      <strong>ADDED TO CART</strong>
      <span>Your item is now in your cart.</span>
    </div>
  `;

  document.body.appendChild(notification);

  requestAnimationFrame(() => {
    notification.classList.add("show");
  });

  setTimeout(() => {
    notification.classList.remove("show");

    setTimeout(() => {
      notification.remove();
    }, 300);
  }, 2500);
}
  
function orderNow() {
  if (!selectedSize) {
    alert("Please select a size.");
    return;
  }

  const quantity = document.getElementById("quantity").value;
  const product = window.currentProduct;

  const params = new URLSearchParams({
    product: product.product,
    price: product.price,
    size: selectedSize,
    quantity: quantity
  });

  window.location.href = "checkout.html?" + params.toString();
}
  function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
  
loadProduct();
  function updateCartCount() {
  const cart = JSON.parse(localStorage.getItem("notoriousCart")) || [];
  const total = cart.reduce((sum, item) => sum + Number(item.quantity), 0);

  const cartCount = document.getElementById("cartCount");
  if (cartCount) {
    cartCount.textContent = total;
  }
}

updateCartCount();
